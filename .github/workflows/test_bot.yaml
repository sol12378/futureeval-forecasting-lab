name: Test Bot
# Forecasts every open question in the unscored Bot Testing Area (resubmission allowed there).
on:
  workflow_dispatch:
    inputs:
      predictions:
        description: "Predictions per question (1-5)"
        default: "1"

permissions:
  contents: read # the forecasting job is read-only; save_ledger below gets write

concurrency:
  group: futureeval-test
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
      ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GPT_MODEL: ${{ vars.GPT_MODEL }}
      RESEARCH_REPORTS_PER_QUESTION: "1"
      PREDICTIONS_PER_RESEARCH_REPORT: ${{ inputs.predictions || '1' }}
      CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '200' }}
      GPT_MONTHLY_BUDGET_USD: ${{ vars.GPT_MONTHLY_BUDGET_USD || '100' }}
      BUDGET_SOFT_RATIO: ${{ vars.BUDGET_SOFT_RATIO || '0.70' }}
      BUDGET_HARD_RATIO: ${{ vars.BUDGET_HARD_RATIO || '0.90' }}
      RUN_COST_CAP_USD: ${{ vars.RUN_COST_CAP_USD || '8' }}
      LEDGER_DIR: ops_ledger
      REQUIRE_LEDGER: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Check API configuration
        run: python scripts/preflight.py
      - name: Load spend ledger
        run: bash scripts/ledger.sh pull
      - name: Install upstream-locked dependencies
        run: uv sync --locked
      - name: Forecast in Bot Testing Area (test only)
        run: uv run python main.py --mode test_questions
      - name: Collect new ledger records
        if: always()
        run: bash scripts/ledger.sh collect ledger_out
      - name: Upload new ledger records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-records
          path: ledger_out/
          if-no-files-found: ignore
          retention-days: 7

  # Separate, minimal job: the only one holding a write token. It checks out this repo,
  # validates the records produced above and appends them to the ops-ledger branch.
  # No third-party Python packages or LLM code run here.
  save_ledger:
    needs: forecast_job
    if: ${{ always() && needs.forecast_job.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      LEDGER_DIR: ops_ledger
    steps:
      - uses: actions/checkout@v4
      - name: Download new ledger records
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ledger-records
          path: ledger_in
      - name: Append records to ops-ledger
        if: ${{ steps.download.outcome == 'success' }}
        run: |
          bash scripts/ledger.sh pull
          bash scripts/ledger.sh ingest ledger_in
          bash scripts/ledger.sh push
