name: Test Bot
# Forecasts every open question in the unscored Bot Testing Area (resubmission allowed there).
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Forecaster plan, e.g. claude,gpt (empty = repository default)"
        default: ""
      research:
        description: "Research sources, e.g. claude_web,gpt_web,asknews (empty = repository default)"
        default: ""

permissions:
  contents: read # the forecasting job is read-only; save_ledger below gets write

concurrency:
  group: futureeval-test
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }} # optional: used after key 1 runs out of credit
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }} # optional: used after key 1 runs out of credit
      ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
      ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }} # official Metaculus setup uses an API key
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GPT_MODEL: ${{ vars.GPT_MODEL }}
      GPT_REASONING_EFFORT: ${{ vars.GPT_REASONING_EFFORT }}
      FORECASTER_PLAN: ${{ inputs.plan || vars.FORECASTER_PLAN }}
      CLAUDE_FORECAST_EFFORT: ${{ vars.CLAUDE_FORECAST_EFFORT }}
      GPT_FORECAST_MODEL: ${{ vars.GPT_FORECAST_MODEL }}
      GPT_FORECAST_EFFORT: ${{ vars.GPT_FORECAST_EFFORT }}
      RESEARCH_SOURCES: ${{ inputs.research || vars.RESEARCH_SOURCES }}
      CLAUDE_RESEARCH_MODEL: ${{ vars.CLAUDE_RESEARCH_MODEL }}
      GPT_RESEARCH_MODEL: ${{ vars.GPT_RESEARCH_MODEL }}
      GPT_RESEARCH_EFFORT: ${{ vars.GPT_RESEARCH_EFFORT }}
      RESEARCH_REPORTS_PER_QUESTION: "1"
      CLAUDE_MONTHLY_BUDGET_PER_KEY_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_PER_KEY_USD || '200' }}
      GPT_MONTHLY_BUDGET_PER_KEY_USD: ${{ vars.GPT_MONTHLY_BUDGET_PER_KEY_USD || '100' }}
      BUDGET_SOFT_RATIO: ${{ vars.BUDGET_SOFT_RATIO || '0.70' }}
      BUDGET_HARD_RATIO: ${{ vars.BUDGET_HARD_RATIO || '0.90' }}
      RUN_COST_CAP_USD: ${{ vars.RUN_COST_CAP_USD || '8' }}
      ASKNEWS_TOTAL_CALL_CAP: ${{ vars.ASKNEWS_TOTAL_CALL_CAP || '150' }} # ~$15 prepaid AskNews wallet
      LEDGER_DIR: ops_ledger
      REQUIRE_LEDGER: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Check API configuration
        run: python scripts/preflight.py
      - name: Load spend ledger
        run: bash scripts/ledger.sh pull
      - name: Install upstream-locked dependencies
        run: uv sync --locked
      - name: Forecast in Bot Testing Area (test only)
        run: uv run python main.py --mode test_questions
      - name: Collect new ledger records
        if: always()
        run: bash scripts/ledger.sh collect ledger_out
      - name: Upload new ledger records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-records
          path: ledger_out/
          if-no-files-found: ignore
          retention-days: 7

  # Separate, minimal job: the only one holding a write token. It checks out this repo,
  # validates the records produced above and appends them to the ops-ledger branch.
  # No third-party Python packages or LLM code run here.
  save_ledger:
    needs: forecast_job
    if: ${{ always() && needs.forecast_job.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      LEDGER_DIR: ops_ledger
    steps:
      - uses: actions/checkout@v4
      - name: Download new ledger records
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ledger-records
          path: ledger_in
      - name: Append records to ops-ledger
        if: ${{ steps.download.outcome == 'success' }}
        run: |
          bash scripts/ledger.sh pull
          bash scripts/ledger.sh ingest ledger_in
          bash scripts/ledger.sh push
