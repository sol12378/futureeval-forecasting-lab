name: Coverage audit
# Fails (=> e-mail to the owner) if any FutureEval/MiniBench question that opened in the last
# 24 h still has no forecast from the bot an hour after opening. Read-only: no LLM calls.
# Dispatched by the scheduler at the start of every ~5.5 h link; can also be run by hand.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Window in hours"
        default: "24"

permissions:
  contents: read

concurrency:
  group: futureeval-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # check_environment() requires at least one LLM key to be present; none is used here.
      AUDIT_HOURS: ${{ inputs.hours || '24' }}
      AUDIT_NOT_BEFORE: "2026-11-21T02:50:00Z" # live submission started here
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Audit coverage
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python main.py --mode audit --hours "$AUDIT_HOURS"
