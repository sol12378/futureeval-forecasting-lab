name: Forecast on new AI tournament questions
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read
concurrency:
  group: futureeval-prod
  cancel-in-progress: false

jobs:
  forecast_job:
    # Keep scheduled AND manual live submission disabled until the owner explicitly opts in.
    if: ${{ vars.ENABLE_LIVE_FORECASTS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
      ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GPT_MODEL: ${{ vars.GPT_MODEL }}
      RESEARCH_REPORTS_PER_QUESTION: "1"
      PREDICTIONS_PER_RESEARCH_REPORT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Check API configuration
        run: python scripts/preflight.py
      - name: Install upstream-locked dependencies
        run: uv sync --locked
      - name: Forecast FutureEval and MiniBench
        run: uv run python main.py --mode tournament
