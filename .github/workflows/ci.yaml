name: CI
# Offline checks only: no secrets, no LLM calls, no Metaculus calls.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Compile
        run: uv run python -m compileall -q main.py forecast_config.py budget_guard.py scripts

  # Public repo guard: secret scan, sensitive file names, noreply-only commit identities,
  # and (optionally) personal strings kept in the PRIVACY_DENYLIST secret (never printed).
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks (sha256 verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
      - name: Check new commits
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          export FUTUREEVAL_DENYLIST="$RUNNER_TEMP/denylist.txt"
          printf '%s\n' "$PRIVACY_DENYLIST" > "$FUTUREEVAL_DENYLIST"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          bash scripts/privacy_check.sh range "$range"
      - name: Scan the whole current tree
        run: gitleaks dir . --no-banner --redact --exit-code 1
      - name: Self-test of the privacy gate
        run: python3 -m unittest tests.test_privacy_check -v
