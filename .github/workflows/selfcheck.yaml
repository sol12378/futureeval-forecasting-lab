name: Research sources self-check
# Calls Tavily, Exa, prediction markets and FRED/CoinGecko once each on two fixed sample
# questions and prints result sizes and previews. No forecasts, no Metaculus writes.
# Cost: 2 Tavily credits, 2 Exa searches, 2 tiny GPT extraction calls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Self-check research sources
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY_2: ${{ secrets.ANTHROPIC_API_KEY_2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
          CLAUDE_KEY_ORDER: ${{ vars.CLAUDE_KEY_ORDER }}
          GPT_KEY_ORDER: ${{ vars.GPT_KEY_ORDER }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python main.py --mode selfcheck
